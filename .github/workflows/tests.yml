name: tests

# Runs the tests that do not need arcpy (alarm_core, SQL vs. Python filter logic, .dbf reader,
# comparison and report). The integration tests need ArcGIS Pro and the results on L: and are
# skipped here; run them locally with propy.bat (see README, "Development").

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # 3.9 = ArcGIS Pro 3.0, 3.11 = ArcGIS Pro 3.2+
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest tests -q -rs
